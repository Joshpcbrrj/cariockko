name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run API tests
        run: npm test
        working-directory: api

      - name: Type-check and build API
        run: |
          npm run lint
          npm run build
        working-directory: api

      - name: Run web unit and integration tests
        run: npm test
        working-directory: web

      - name: Type-check web
        run: npm run typecheck
        working-directory: web

      - name: Run browser end-to-end tests
        run: npm run test:e2e
        working-directory: web
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash enables pipefail, so piping through tee keeps failures.
        shell: bash
    env:
      CARIOCKKO_SOURCE_DIR: ${{ github.workspace }}
      CARIOCKKO_DIR: /tmp/cariockko
      CARIOCKKO_VERSION: ci
      CARIOCKKO_NO_BROWSER: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck scripts/install.sh

      - name: Check that install.ps1 is ASCII-only
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' scripts/install.ps1; then
            echo "scripts/install.ps1 must be ASCII-only; write accents as \\u00e3 escapes."
            exit 1
          fi

      - name: Install with the script
        run: bash scripts/install.sh < /dev/null 2>&1 | tee /tmp/install.log
        env:
          OPENAI_API_KEY: sk-ci-placeholder

      - name: Check the running application
        run: |
          curl -fsS http://localhost:3000 > /dev/null
          curl -fsS http://localhost:3001/health/ready
          grep -q '^AI_PROVIDER=openai$' "$CARIOCKKO_DIR/.env"
          if grep -q '^POSTGRES_PASSWORD=local-dev-password$' "$CARIOCKKO_DIR/.env"; then
            echo "The installer kept the example database password."
            exit 1
          fi

      - name: Update keeps the configuration
        run: |
          before="$(sha256sum "$CARIOCKKO_DIR/.env")"
          bash scripts/install.sh < /dev/null
          after="$(sha256sum "$CARIOCKKO_DIR/.env")"
          test "$before" = "$after"
          curl -fsS http://localhost:3001/health/ready

      - name: Uninstall
        run: |
          CARIOCKKO_DELETE_DATA=1 bash scripts/install.sh --uninstall < /dev/null
          test ! -e "$CARIOCKKO_DIR"
          test -z "$(docker ps -q --filter name=cariockko)"

      # Annotations are readable without signing in, unlike the job logs.
      - name: Report failure details
        if: failure()
        run: |
          {
            echo "== installer output =="
            tail -n 60 /tmp/install.log 2>/dev/null || true
            echo "== containers =="
            (cd "$CARIOCKKO_DIR" && docker compose ps -a) 2>&1 || true
            echo "== container logs =="
            (cd "$CARIOCKKO_DIR" && docker compose logs --no-color --tail 30) 2>&1 || true
          } | tr -d '\r' | tail -c 30000 > /tmp/report.txt
          cat /tmp/report.txt
          echo "::error title=Installer failure::$(sed -e 's/%/%25/g' /tmp/report.txt | awk '{ printf "%s%%0A", $0 }')"
