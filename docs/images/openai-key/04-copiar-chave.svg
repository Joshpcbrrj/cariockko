<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Passo 4: copiar a chave, que só aparece uma vez</title>
  <rect width="800" height="420" rx="16" fill="#f1f5f9"/>
  <rect x="40" y="30" width="720" height="360" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="130" y="70" width="540" height="290" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="160" y="112" font-size="22" font-weight="600" fill="#0f172a">Save your key</text>
  <text x="160" y="144" font-size="14" fill="#475569">Please save your secret key in a safe place since you won't be able</text>
  <text x="160" y="164" font-size="14" fill="#475569">to view it again.</text>
  <rect x="160" y="190" width="370" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="176" y="218" font-size="15" fill="#0f172a" font-family="Consolas, Menlo, monospace">sk-proj-••••••••••••••••••••</text>
  <rect x="542" y="190" width="98" height="44" rx="8" fill="#0f172a"/>
  <text x="591" y="218" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Copy</text>
  <rect x="534" y="182" width="114" height="60" rx="12" fill="none" stroke="#4f46e5" stroke-width="4"/>
  <circle cx="696" cy="212" r="20" fill="#4f46e5"/>
  <text x="696" y="219" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="160" y="262" width="480" height="70" rx="10" fill="#fef3c7"/>
  <text x="180" y="290" font-size="14" font-weight="600" fill="#92400e">A chave aparece só desta vez.</text>
  <text x="180" y="312" font-size="14" fill="#92400e">Copie agora. Se perder, apague-a e crie outra.</text>
</svg>
