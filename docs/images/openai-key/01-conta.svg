<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Passo 1: criar uma conta em platform.openai.com</title>
  <rect width="800" height="420" rx="16" fill="#f1f5f9"/>
  <rect x="40" y="30" width="720" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M40 42a12 12 0 0 1 12-12h696a12 12 0 0 1 12 12v32H40z" fill="#e2e8f0"/>
  <circle cx="64" cy="52" r="6" fill="#f87171"/>
  <circle cx="84" cy="52" r="6" fill="#fbbf24"/>
  <circle cx="104" cy="52" r="6" fill="#34d399"/>
  <rect x="130" y="40" width="440" height="24" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="148" y="57" font-size="14" fill="#0f172a">platform.openai.com/signup</text>
  <text x="400" y="140" font-size="26" font-weight="600" fill="#0f172a" text-anchor="middle">Create your account</text>
  <rect x="250" y="168" width="300" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="266" y="193" font-size="15" fill="#64748b">Email address</text>
  <rect x="250" y="222" width="300" height="44" rx="8" fill="#0f172a"/>
  <text x="400" y="250" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Continue</text>
  <rect x="242" y="214" width="316" height="60" rx="12" fill="none" stroke="#4f46e5" stroke-width="4"/>
  <text x="400" y="306" font-size="14" fill="#64748b" text-anchor="middle">ou continue com Google, Microsoft ou Apple</text>
  <circle cx="610" cy="244" r="20" fill="#4f46e5"/>
  <text x="610" y="251" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="640" y="236" font-size="14" fill="#312e81">Crie a conta e</text>
  <text x="640" y="256" font-size="14" fill="#312e81">confirme o e-mail</text>
</svg>
