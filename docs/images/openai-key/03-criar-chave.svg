<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Passo 3: criar uma chave em API keys</title>
  <rect width="800" height="420" rx="16" fill="#f1f5f9"/>
  <rect x="40" y="30" width="720" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M40 42a12 12 0 0 1 12-12h696a12 12 0 0 1 12 12v32H40z" fill="#e2e8f0"/>
  <circle cx="64" cy="52" r="6" fill="#f87171"/>
  <circle cx="84" cy="52" r="6" fill="#fbbf24"/>
  <circle cx="104" cy="52" r="6" fill="#34d399"/>
  <rect x="130" y="40" width="440" height="24" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="148" y="57" font-size="14" fill="#0f172a">platform.openai.com/api-keys</text>
  <text x="80" y="122" font-size="24" font-weight="600" fill="#0f172a">API keys</text>
  <rect x="480" y="98" width="240" height="44" rx="8" fill="#0f172a"/>
  <text x="600" y="126" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">+ Create new secret key</text>
  <rect x="472" y="90" width="256" height="60" rx="12" fill="none" stroke="#4f46e5" stroke-width="4"/>
  <line x1="80" y1="178" x2="720" y2="178" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="204" font-size="13" font-weight="600" fill="#64748b">NAME</text>
  <text x="320" y="204" font-size="13" font-weight="600" fill="#64748b">SECRET KEY</text>
  <text x="560" y="204" font-size="13" font-weight="600" fill="#64748b">CREATED</text>
  <line x1="80" y1="218" x2="720" y2="218" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="262" font-size="14" fill="#94a3b8" text-anchor="middle">Nenhuma chave ainda</text>
  <circle cx="440" cy="120" r="20" fill="#4f46e5"/>
  <text x="440" y="127" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="80" y="296" width="640" height="64" rx="10" fill="#eef2ff"/>
  <text x="100" y="322" font-size="14" fill="#312e81">Dê um nome à chave (por exemplo, "Cariockko"), mantenha o projeto padrão</text>
  <text x="100" y="344" font-size="14" fill="#312e81">e clique em "Create secret key".</text>
</svg>
