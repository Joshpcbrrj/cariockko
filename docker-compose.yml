services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        # Used by Next.js `rewrites()` at build time — destinations are
        # baked into `.next/routes-manifest.json` and cannot be overridden
        # at runtime, so they must be passed in here.
        API_INTERNAL_URL: http://api:3001
        MINIO_INTERNAL_URL: http://minio:9000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - API_INTERNAL_URL=http://api:3001
      - MINIO_INTERNAL_URL=http://minio:9000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_BUCKET=${MINIO_BUCKET:-audio}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_MODEL_CHAT=${OPENAI_MODEL_CHAT:-gpt-4o-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - LOCAL_STT_BASE_URL=${LOCAL_STT_BASE_URL:-http://host.docker.internal:8000/v1}
      - LOCAL_STT_MODEL=${LOCAL_STT_MODEL:-Systran/faster-whisper-small}
      - LOCAL_TTS_BASE_URL=${LOCAL_TTS_BASE_URL:-http://host.docker.internal:8880/v1}
      - LOCAL_TTS_MODEL=${LOCAL_TTS_MODEL:-kokoro}
      - LOCAL_TTS_VOICE=${LOCAL_TTS_VOICE:-af_heart}
      - GEN_CONCURRENCY=${GEN_CONCURRENCY:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Liveness probe: passes as soon as the HTTP server is up (~2-3s after
      # container start). Lessons are no longer auto-seeded; users create
      # them on demand via the Content Producer tab.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: cariockko-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Only for tools on this machine; the API reaches the database through the Docker network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  minio:
    # MinIO no longer publishes images; pgsty builds the same open-source code.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: cariockko-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: cariockko-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-audio} &&
      mc anonymous set download local/${MINIO_BUCKET:-audio} &&
      echo 'Bucket ${MINIO_BUCKET:-audio} created successfully'
      "

volumes:
  pgdata:
  minio-data:
